  summary: >-
    以当前模块名开始一个自定义 span（挂在框架链路源的模块源下），

    用于把模块内的关键工作纳入同一棵链路树。未接入 OpenTelemetry 时返回 null（无开销）。
  example: []
  syntax:
    content: public Activity? StartActivity(string name)
    parameters:
    - id: name
      type: System.String
    return:
      type: System.Diagnostics.Activity
