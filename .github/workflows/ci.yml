name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0    # MinVer/版本推断需要完整历史（当前用 tag 传参）

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: 还原
        run: dotnet restore

      - name: 漏洞扫描（NuGet）
        shell: bash
        run: |
          set -euo pipefail
          json=$(dotnet list Ledon.slnx package --vulnerable --include-transitive --format json 2>&1)
          if grep -q '"vulnerabilities"' <<< "$json"; then
            echo "$json"
            echo "::error::发现易受攻击的 NuGet 包，请升级后重试"
            exit 1
          fi
          echo "未发现已知漏洞的 NuGet 包"

      - name: 构建（Release，警告即错误）
        run: dotnet build --configuration Release --no-restore -p:TreatWarningsAsErrors=true

      - name: 测试（含覆盖率收集）
        run: >
          dotnet test --configuration Release --no-build
          --logger trx --results-directory TestResults
          --collect:"XPlat Code Coverage"

      - name: 覆盖率门禁（每个覆盖率文件行覆盖不低于 50%）
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          files=$(find TestResults -name coverage.cobertura.xml -type f 2>/dev/null || true)
          if [ -z "$files" ]; then
            echo "::error::未找到覆盖率报告"
            exit 1
          fi

          failed=0
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            # 不用 grep|head（pipefail 下 EPIPE 会让步骤失败）；awk 单进程读文件
            rate=$(awk -F'"' '/line-rate=/ {print $2; exit}' "$file")
            pct=$(awk -v r="${rate:-0}" 'BEGIN {printf "%.1f", r * 100}')
            echo "$file 行覆盖率：${pct}%"
            echo "### 测试覆盖率：$file 行 ${pct}%" >> "$GITHUB_STEP_SUMMARY"
            if awk -v r="${rate:-0}" 'BEGIN {exit !(r < 0.5)}'; then
              echo "::error::行覆盖率 ${pct}% 低于 50%：$file"
              failed=1
            fi
          done <<< "$files"

          exit $failed

      - name: 上传测试结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: |
            TestResults/**/*.trx
            TestResults/**/coverage.cobertura.xml

      - name: 模板冒烟测试（React / Blazor）
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          hive=$(mktemp -d)
          out=$(mktemp -d)
          dotnet new install templates --debug:custom-hive "$hive" >/dev/null
          dotnet new ledon-react -n Ci.React -o "$out/react" --debug:custom-hive "$hive" >/dev/null
          dotnet new ledon-blazor -n Ci.Blazor -o "$out/blazor" --debug:custom-hive "$hive" >/dev/null
          dotnet build "$out/react/Ci.React.csproj" -c Release -p:LedonSourcePath="$PWD/src"
          dotnet build "$out/blazor/Ci.Blazor.csproj" -c Release -p:LedonSourcePath="$PWD/src"

      - name: 构建文档站（docfx 验证）
        run: |
          dotnet tool restore
          dotnet docfx docfx.json

  pack:
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: 检查 NUGET_API_KEY
        shell: bash
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::缺少仓库 Secret NUGET_API_KEY，无法发布 NuGet 包"
            exit 1
          fi

      - name: 打包（版本取自 tag，如 v0.2.0 → 0.2.0）
        run: |
          version="${GITHUB_REF_NAME#v}"
          dotnet pack Ledon.slnx --configuration Release -p:Version="$version" -o out

      - name: 推送到 NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          dotnet nuget push out/*.nupkg \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
