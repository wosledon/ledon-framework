  namespace: Ledon.Caching
  summary: >-
    读取缓存，未命中则执行 <code class="paramref">factory</code> 回源并写入后返回。

    同一 key 的并发未命中会共享同一次回源（single-flight）。
  example: []
  syntax:
    content: Task<T?> GetOrCreateAsync<T>(string key, Func<CancellationToken, Task<T>> factory, TimeSpan? expiration = null, CancellationToken cancellationToken = default)
    parameters:
    - id: key
      type: System.String
    - id: factory
      type: System.Func{System.Threading.CancellationToken,System.Threading.Tasks.Task{{T}}}
    - id: expiration
      type: System.Nullable{System.TimeSpan}
    - id: cancellationToken
      type: System.Threading.CancellationToken
    typeParameters:
    - id: T
    return:
      type: System.Threading.Tasks.Task{{T}}
    content.vb: Function GetOrCreateAsync(Of T)(key As String, factory As Func(Of CancellationToken, Task(Of T)), expiration As TimeSpan? = Nothing, cancellationToken As CancellationToken = Nothing) As Task(Of T)
