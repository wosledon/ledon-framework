<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ledon Config Center</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <strong>Ledon Config Center</strong>
      <span class="subtitle">项目 · 环境 · 配置版本 · 权限</span>
    </div>
    <div id="user-area" class="hidden">
      <span id="who"></span>
      <button id="logout" class="ghost">退出</button>
    </div>
  </header>

  <main id="login-panel" class="login">
    <section class="panel">
      <h1>登录配置中心</h1>
      <p class="hint">演示账号：admin/admin123（系统管理员）、user/user123（项目 Maintainer）、viewer/viewer123（Viewer）</p>
      <label>用户名 <input id="username" value="admin" autocomplete="username" /></label>
      <label>密码 <input id="password" type="password" value="admin123" autocomplete="current-password" /></label>
      <div class="actions">
        <button id="login">登录</button>
        <button id="login-user" class="ghost">普通用户演示</button>
        <button id="login-viewer" class="ghost">只读用户演示</button>
      </div>
      <p id="login-error" class="error"></p>
    </section>
  </main>

  <main id="app-panel" class="layout hidden">
    <aside class="panel sidebar">
      <div class="toolbar">
        <h2>项目</h2>
        <button id="refresh-projects" class="small ghost">刷新</button>
      </div>
      <div id="projects" class="project-list"></div>

      <h2 class="section-title">新建项目</h2>
      <label>Key <input id="new-project-key" placeholder="my-project" /></label>
      <label>名称 <input id="new-project-name" placeholder="我的项目" /></label>
      <label>描述 <input id="new-project-desc" placeholder="可选" /></label>
      <button id="create-project">创建项目</button>
    </aside>

    <section id="project-panel" class="content hidden">
      <section class="panel">
        <div class="toolbar">
          <div>
            <h1 id="project-name"></h1>
            <p id="project-meta" class="hint"></p>
          </div>
          <div class="actions">
            <button id="delete-project" class="danger hidden">删除项目</button>
          </div>
        </div>
        <p id="permissions" class="badge-line"></p>
      </section>

      <section class="panel">
        <div class="toolbar">
          <h2>配置项</h2>
          <div class="actions">
            <select id="environment"></select>
            <button id="refresh-configs" class="small ghost">刷新</button>
          </div>
        </div>
        <table>
          <thead><tr><th>Key</th><th>值</th><th>版本</th><th>操作</th></tr></thead>
          <tbody id="configs"></tbody>
        </table>
      </section>

      <section class="panel">
        <h2>编辑配置</h2>
        <label>Key <input id="config-key" placeholder="Feature:Checkout" /></label>
        <label>Value（JSON）<textarea id="config-value" rows="4">"hello"</textarea></label>
        <div class="actions">
          <button id="save-config">保存</button>
          <button id="delete-config" class="danger">删除</button>
          <button id="history-config" class="ghost">查看历史</button>
        </div>
        <p class="hint">字符串需要双引号；数字、布尔、对象直接写 JSON。</p>
        <pre id="history" class="output hidden"></pre>
      </section>

      <section id="members-panel" class="panel hidden">
        <div class="toolbar">
          <h2>项目成员</h2>
        </div>
        <table>
          <thead><tr><th>用户</th><th>角色</th><th></th></tr></thead>
          <tbody id="members"></tbody>
        </table>
        <div class="inline-form">
          <input id="member-user" placeholder="用户 ID（如 user）" />
          <select id="member-role">
            <option value="viewer">viewer</option>
            <option value="maintainer">maintainer</option>
            <option value="owner">owner</option>
          </select>
          <button id="add-member">添加/更新成员</button>
        </div>
      </section>

      <p id="message" class="message"></p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
