  summary: >-
    弹性策略入口。日常用法一行：

    <pre><code class="lang-csharp">builder.Services.AddLedonResilience();</code></pre>

    注册名为 <code>ledon-http</code> 的韧性管道（指数退避重试 + 尝试超时 + 熔断），

    并默认挂到全部 <xref href="System.Net.Http.HttpClient" data-throw-if-not-resolved="false"></xref>（IHttpClientFactory 创建）；

    自定义客户端可 <code>.AddResilienceHandler("ledon-http")</code> 显式接入。
