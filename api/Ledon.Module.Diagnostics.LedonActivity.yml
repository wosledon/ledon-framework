  namespace: Ledon.Module.Diagnostics
  summary: >-
    框架自身的链路源（OpenTelemetry ActivitySource）。框架的核心机制——模块生命周期、

    事件发布、队列处理——都会以 span 形式发出，"框架帮你做了什么"因此全程可观测。

    接入方式：AddLedonObservability() 会自动监听这些源；也可自行 AddSource("Ledon")。
