  summary: >-
    定时任务契约。实现类被自动发现；<xref href="Ledon.Scheduling.IScheduledTask.CronExpression" data-throw-if-not-resolved="false"></xref> 为 6 段（含秒）或 5 段 cron 表达式。

    同一任务实例是单例——执行中不会并发重入（上次未结束会跳过错过的触发，不会堆积）。
