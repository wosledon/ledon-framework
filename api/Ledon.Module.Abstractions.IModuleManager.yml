    id: InitializeAsync
    path: src/Ledon.Module/Abstractions/IModuleManager.cs
    startLine: 25
  assemblies:
  - Ledon.Module
  namespace: Ledon.Module.Abstractions
  summary: >-
    初始化全部模块：按拓扑序依次调用各模块的 <xref href="Ledon.Module.Abstractions.IModule.OnInitializedAsync(Ledon.Module.Abstractions.ModuleContext%2cSystem.Threading.CancellationToken)" data-throw-if-not-resolved="false"></xref>。

    任一模块失败时将已初始化模块逆序回滚，并抛出原始异常。
  example: []
  syntax:
    content: Task InitializeAsync(IServiceProvider services, CancellationToken cancellationToken = default)
    parameters:
    - id: services
      type: System.IServiceProvider
    - id: cancellationToken
      type: System.Threading.CancellationToken
    return:
      type: System.Threading.Tasks.Task
    content.vb: Function InitializeAsync(services As IServiceProvider, cancellationToken As CancellationToken = Nothing) As Task
  overload: Ledon.Module.Abstractions.IModuleManager.InitializeAsync*
