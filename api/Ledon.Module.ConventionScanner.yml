  assemblies:
  - Ledon.Module
  namespace: Ledon.Module
  summary: >-
    约定扫描自动注册：把程序集中的类按约定批量注册进服务容器。

    每个具体类依次应用以下规则（全部使用 <code>TryAdd</code>，已手动注册的不会被覆盖）：

    <ol><li>存在与类同名的接口（<code>IName</code> ↔ <code>Name</code>，忽略泛型 arity）→ 注册这些接口，使用指定生命周期；</li><li>实现了 <xref href="Ledon.Core.Events.IEventHandler%601" data-throw-if-not-resolved="false"></xref> → 以瞬时生命周期注册这些处理器接口（保证每次发布新建实例）。</li></ol>

    没有接口的类（DTO、控制器、端点等）**不会**被自动注册——这不仅是减少噪音：

    把 MVC 动作参数类型注册进容器会让 <code>[ApiController]</code> 的隐式 <code>[FromBody]</code> 推断失效

    （实测：注册即退化为查询字符串绑定）。此类类型请显式注册。
  example: []
  syntax:
    content: public static class ConventionScanner
    content.vb: Public Module ConventionScanner
