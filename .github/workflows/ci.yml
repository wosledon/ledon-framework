name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # MinVer/版本推断需要完整历史（当前用 tag 传参）

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: 还原
        run: dotnet restore

      - name: 构建（Release，警告即错误）
        run: dotnet build --configuration Release --no-restore -p:TreatWarningsAsErrors=true

      - name: 测试（含覆盖率收集）
        run: >
          dotnet test --configuration Release --no-build
          --logger trx --results-directory TestResults
          --collect:"XPlat Code Coverage"

      - name: 上传测试结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TestResults/**/*.trx
            TestResults/**/coverage.cobertura.xml

      - name: 构建文档站（docfx 验证）
        run: |
          dotnet tool restore
          dotnet docfx docfx.json

  pack:
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: 打包（版本取自 tag，如 v0.2.0 → 0.2.0）
        run: |
          version="${GITHUB_REF_NAME#v}"
          dotnet pack --configuration Release -p:Version="$version" -o out

      - name: 推送到 NuGet.org
        run: dotnet nuget push out/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
