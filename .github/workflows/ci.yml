name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0    # MinVer/版本推断需要完整历史（当前用 tag 传参）

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: 还原
        run: dotnet restore

      - name: 构建（Release，警告即错误）
        run: dotnet build --configuration Release --no-restore -p:TreatWarningsAsErrors=true

      - name: 测试（含覆盖率收集）
        run: >
          dotnet test --configuration Release --no-build
          --logger trx --results-directory TestResults
          --collect:"XPlat Code Coverage"

      - name: 覆盖率汇总（行覆盖，低于 50% 告警不阻断）
        if: always()
        shell: bash
        run: |
          file=$(ls TestResults/*/coverage.cobertura.xml 2>/dev/null | head -1 || true)
          if [ -z "$file" ]; then echo "未找到覆盖率报告"; exit 0; fi
          # 不用 grep|head（pipefail 下 EPIPE 会让步骤失败）；awk 单进程读文件
          rate=$(awk -F'"' '/line-rate=/ {print $2; exit}' "$file")
          pct=$(awk -v r="${rate:-0}" 'BEGIN {printf "%.1f", r * 100}')
          echo "行覆盖率：${pct}%"
          echo "### 测试覆盖率：行 ${pct}%" >> "$GITHUB_STEP_SUMMARY"
          if awk -v r="${rate:-0}" 'BEGIN {exit !(r < 0.5)}'; then
            echo "::warning::行覆盖率 ${pct}% 低于 50%"
          fi
          exit 0

      - name: 上传测试结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: |
            TestResults/**/*.trx
            TestResults/**/coverage.cobertura.xml

      - name: 构建文档站（docfx 验证）
        run: |
          dotnet tool restore
          dotnet docfx docfx.json

  pack:
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: 打包（版本取自 tag，如 v0.2.0 → 0.2.0）
        run: |
          version="${GITHUB_REF_NAME#v}"
          dotnet pack --configuration Release -p:Version="$version" -o out

      - name: 推送到 NuGet.org
        run: dotnet nuget push out/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
