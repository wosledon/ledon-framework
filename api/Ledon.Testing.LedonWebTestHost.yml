    CreateBuilder/UseTestServer/Build/StartAsync 样板。

    <pre><code class="lang-csharp">await using var host = LedonWebTestHost.Create(builder =&gt; builder.AddLedonWeb());

    var body = await host.Client.GetStringAsync("/hello");</code></pre>
