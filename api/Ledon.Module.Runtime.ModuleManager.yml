  summary: >-
    初始化全部模块：按拓扑序依次调用各模块的 <xref href="Ledon.Module.Abstractions.IModule.OnInitializedAsync(Ledon.Module.Abstractions.ModuleContext%2cSystem.Threading.CancellationToken)" data-throw-if-not-resolved="false"></xref>。

