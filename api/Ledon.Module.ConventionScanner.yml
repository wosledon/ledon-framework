  summary: 扫描 <code class="paramref">assembly</code> 并按约定注册服务。
  example: []
  syntax:
    content: public static IServiceCollection ScanAssembly(this IServiceCollection services, Assembly assembly, ServiceLifetime lifetime = ServiceLifetime.Scoped, ICollection<string>? log = null)
    parameters:
    - id: services
      type: Microsoft.Extensions.DependencyInjection.IServiceCollection
      description: 服务集合。
    - id: assembly
      type: System.Reflection.Assembly
      description: 要扫描的程序集。
    - id: lifetime
      type: Microsoft.Extensions.DependencyInjection.ServiceLifetime
      description: 无接口类/同名接口类的默认生命周期，默认 <xref href="Microsoft.Extensions.DependencyInjection.ServiceLifetime.Scoped" data-throw-if-not-resolved="false"></xref>。
    - id: log
      type: System.Collections.Generic.ICollection{System.String}
      description: 可选的诊断收集器：记录每条约定注册，便于回答"这个服务是谁注册的"。
    return:
      type: Microsoft.Extensions.DependencyInjection.IServiceCollection
    content.vb: Public Shared Function ScanAssembly(services As IServiceCollection, assembly As Assembly, lifetime As ServiceLifetime = ServiceLifetime.Scoped, log As ICollection(Of String) = Nothing) As IServiceCollection
