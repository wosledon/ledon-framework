  assemblies:
  - Ledon.Caching
  namespace: Ledon.Caching
  summary: >-
    缓存服务契约。按 key 读写，未命中时用工厂回源并写入。

    v1 为进程内内存实现；需要分布式缓存（Redis 等）时替换此实现即可，

    调用方代码不变（契约与实现分离，换实现不改业务）。
