  type: Method
  source:
    remote:
      path: src/Ledon.Module/Abstractions/IModule.cs
      branch: main
      repo: https://github.com/wosledon/ledon-framework.git
    id: ConfigureServices
    path: src/Ledon.Module/Abstractions/IModule.cs
    startLine: 18
  assemblies:
  - Ledon.Module
  namespace: Ledon.Module.Abstractions
  summary: >-
    注册阶段：向服务容器添加服务。在宿主 <code>BuildServiceProvider()</code> 之前按拓扑序调用。

    此阶段拿不到 <xref href="Ledon.Module.Abstractions.ModuleContext" data-throw-if-not-resolved="false"></xref>（容器尚未构建）——注册应保持"哑"的，

    需要服务或日志的逻辑请放到 <xref href="Ledon.Module.Abstractions.IModule.OnInitializedAsync(Ledon.Module.Abstractions.ModuleContext%2cSystem.Threading.CancellationToken)" data-throw-if-not-resolved="false"></xref>。
  example: []
  syntax:
    content: void ConfigureServices(IServiceCollection services)
    parameters:
    - id: services
      type: Microsoft.Extensions.DependencyInjection.IServiceCollection
    content.vb: Sub ConfigureServices(services As IServiceCollection)
  overload: Ledon.Module.Abstractions.IModule.ConfigureServices*
