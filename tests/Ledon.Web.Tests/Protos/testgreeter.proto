syntax = "proto3";

option csharp_namespace = "Ledon.Web.Tests.Fixtures";

package ledon.test;

// 测试用 gRPC 服务：验证 Ledon.Grpc 的服务发现与约定映射。
service TestGreeter {
  rpc SayHello (HelloRequest) returns (HelloReply);
}

message HelloRequest {
  string name = 1;
}

message HelloReply {
  string message = 1;
}
