  assemblies:
  - Ledon.Module
  namespace: Ledon.Module.Abstractions
  summary: >-
    关闭全部模块：按初始化逆序调用 <xref href="Ledon.Module.Abstractions.IModule.OnShutdownAsync(Ledon.Module.Abstractions.ModuleContext%2cSystem.Threading.CancellationToken)" data-throw-if-not-resolved="false"></xref>。

