name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:   # 手动触发

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留一个部署，新推送取消进行中的旧部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # docfx 的 git 相关信息需要完整历史

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 构建文档站（docfx）
        run: |
          dotnet tool restore
          dotnet docfx docfx.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
