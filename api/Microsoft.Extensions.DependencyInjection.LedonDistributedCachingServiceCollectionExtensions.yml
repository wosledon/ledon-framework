  namespace: Microsoft.Extensions.DependencyInjection
  summary: >-
    分布式缓存入口。多实例部署（水平扩展）时替换进程内实现：

    <pre><code class="lang-csharp">builder.Services.AddLedonDistributedCaching(o =&gt; o.RedisConnectionString = "localhost:6379");</code></pre>

    不配连接字符串时退化为进程内内存实现（开发/单机可用，语义与内存缓存一致）。

    与带 single-flight 的纯内存实现（AddLedonCaching）二选一。
