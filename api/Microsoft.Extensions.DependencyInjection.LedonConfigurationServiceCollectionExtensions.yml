  namespace: Microsoft.Extensions.DependencyInjection
  summary: >-
    强类型配置入口。约定：

    <ul><li>节名默认取类型名去掉 "Options" 后缀（<code>SmtpOptions</code> → 节 <code>Smtp</code>）；</li><li>自动绑定配置节 + DataAnnotations 校验 + <code>ValidateOnStart</code>（配错了启动即失败，不拖到运行时）；</li><li>实现 <xref href="System.ComponentModel.DataAnnotations.IValidatableObject" data-throw-if-not-resolved="false"></xref> 的选项同样在启动时校验。</li></ul>


    <pre><code class="lang-csharp">builder.Services.AddLedonOptions&lt;SmtpOptions&gt;(builder.Configuration);

    // appsettings.json: { "Smtp": { "Host": "...", "Port": 587 } }</code></pre>
